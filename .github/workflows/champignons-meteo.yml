# Lluvia y temperatura por departamento para la app «Champignons de France» (Météo-France, données climatologiques de
# base quotidiennes, Licence Ouverte Etalab 2.0, sin clave). Cada 6 horas actualiza champignons/meteo.json; la app lo
# descarga de raw.githubusercontent.com. Los departamentos (límites IGN) están en champignons/departements_meteo.json,
# copia de app/src/franca/assets/content/comarcas.json de BoletsApps; el script es franca/tools/meteo_meteofrance.py.
name: Champignons - datos de Météo-France

on:
  schedule:
    - cron: "53 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: champignons-meteo
  cancel-in-progress: false

jobs:
  meteo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar y resumir los datos de Météo-France
        run: python3 champignons/meteo_meteofrance.py champignons/meteo.json
      - name: Regenerar la web (portada con la lluvia de la semana)
        run: python3 generador/genera.py champignons
      - name: Publicar meteo.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add champignons/meteo.json champignons/index.html champignons/sitemap.xml
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Champignons: datos de Météo-France $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
